{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error — CamelTrunk</title>
    <link rel="icon" href="{% static 'img/brand/icon.svg' %}" type="image/svg+xml">
    <link rel="icon" href="{% static 'img/brand/favicon-32.png' %}" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'img/brand/apple-touch-icon.png' %}">
    <meta name="theme-color" content="#2b2c41">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: var(--surface-50, #F6F1E7); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .error-container { text-align: center; padding: 2rem; max-width: 480px; }
        .error-code { font-size: 6rem; font-weight: 700; color: var(--danger-text, #dc2626); margin: 0; line-height: 1; font-family: 'Jost', 'Futura', sans-serif; }
        .error-title { font-size: 1.5rem; font-weight: 600; margin: 1rem 0 0.5rem; color: var(--text-main, #1F1F1F); }
        .error-message { color: var(--text-secondary, #3A2C52); margin-bottom: 2rem; }
        .error-link { display: inline-block; padding: 0.75rem 2rem; background: var(--primary, #2b2c41); color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
        .error-link:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="error-container">
        <p class="error-code">500</p>
        <h1 class="error-title">Something Went Wrong</h1>
        <p class="error-message">We're experiencing a temporary issue. Please try again in a few minutes. If the problem persists, contact support.</p>
        <a href="/" class="error-link">Go Home</a>
    </div>
</body>
</html>
