{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error — CamelTrunk</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: var(--surface-50, #F6F1E7); font-family: 'Manrope', sans-serif; }
        .error-container { text-align: center; padding: 2rem; max-width: 480px; }
        .error-code { font-size: 6rem; font-weight: 800; color: #dc2626; margin: 0; line-height: 1; font-family: 'Fraunces', serif; }
        .error-title { font-size: 1.5rem; font-weight: 600; margin: 1rem 0 0.5rem; color: var(--text-main, #1F1F1F); }
        .error-message { color: var(--text-secondary, #3A2C52); margin-bottom: 2rem; }
        .error-link { display: inline-block; padding: 0.75rem 2rem; background: var(--primary, #005F73); color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
        .error-link:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="error-container">
        <p class="error-code">500</p>
        <h1 class="error-title">Something Went Wrong</h1>
        <p class="error-message">We're experiencing a temporary issue. Please try again in a few minutes. If the problem persists, contact support.</p>
        <a href="/" class="error-link">Go Home</a>
    </div>
</body>
</html>
