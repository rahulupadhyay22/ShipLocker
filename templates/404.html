{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — INDIBOX</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: var(--bg-primary, #f5f5f5); font-family: 'Outfit', sans-serif; }
        .error-container { text-align: center; padding: 2rem; max-width: 480px; }
        .error-code { font-size: 6rem; font-weight: 800; color: var(--brand-primary, #2563eb); margin: 0; line-height: 1; }
        .error-title { font-size: 1.5rem; font-weight: 600; margin: 1rem 0 0.5rem; color: var(--text-primary, #1a1a1a); }
        .error-message { color: var(--text-secondary, #666); margin-bottom: 2rem; }
        .error-link { display: inline-block; padding: 0.75rem 2rem; background: var(--brand-primary, #2563eb); color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
        .error-link:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="error-container">
        <p class="error-code">404</p>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="error-link">Go Home</a>
    </div>
</body>
</html>
