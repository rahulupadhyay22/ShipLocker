{% extends "admin/base.html" %}
{% load static %}

{% block title %}Ruffleberry Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">
        <span style="font-weight: 800; color: var(--text-main); letter-spacing: -0.025em; font-size: 1.25rem;">Ruffleberry</span>
    </a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        /* PRO PALETTE: Slate & Indigo 
           Based on high-end enterprise dashboards (e.g. Linear, Stripe, Tailwind UI)
        */
        
        /* Brand Colors */
        --primary: #4F46E5;        /* Indigo 600 - Deep, professional purple-blue */
        --primary-hover: #4338CA;  /* Indigo 700 */
        --primary-light: #EEF2FF;  /* Indigo 50 */
        
        --accent: #0F172A;         /* Slate 900 - Very dark, used for headers */
        
        /* Functional Colors */
        --success: #059669;        /* Emerald 600 - toned down green */
        --bg-success: #D1FAE5;
        
        --danger: #DC2626;         /* Red 600 */
        --bg-danger: #FEE2E2;
        
        --warning: #D97706;        /* Amber 600 */
        
        /* Backgrounds - Moving away from harsh whites */
        --bg-body: #F8FAFC;        /* Slate 50 - Cool gray background */
        --bg-surface: #FFFFFF;     /* Pure white for cards */
        --bg-sidebar: #1E293B;     /* Slate 800 - Classic dark sidebar */
        
        /* Typography */
        --text-main: #1E293B;      /* Slate 800 - Softer than black */
        --text-secondary: #64748B; /* Slate 500 */
        --text-muted: #94A3B8;     /* Slate 400 */
        --text-on-dark: #F8FAFC;   /* Slate 50 */
        
        /* Borders */
        --border-color: #E2E8F0;   /* Slate 200 */
        --border-dark: #334155;    /* Slate 700 (for dark elements) */
        
        /* Dimensions */
        --radius-sm: 4px;
        --radius-md: 6px;
        --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
        background-color: var(--bg-body) !important;
        color: var(--text-main) !important;
    }

    /* --- HEADER --- */
    #header {
        background: var(--bg-surface) !important;
        border-bottom: 1px solid var(--border-color);
        padding: 0 2rem !important;
        height: 60px !important;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--text-main) !important;
        box-shadow: var(--shadow-sm);
    }
    
    #branding h1 {
        color: var(--text-main) !important;
    }

    #user-tools {
        color: var(--text-secondary) !important;
        font-weight: 500;
        font-size: 0.85rem;
    }

    #user-tools a {
        color: var(--text-secondary) !important;
        border-bottom: none !important;
        transition: color 0.2s;
    }
    
    #user-tools a:hover {
        color: var(--primary) !important;
    }

    /* --- SIDEBAR OVERRIDES (Django Nav Sidebar) --- */
    /* This targets the responsive sidebar created by django.contrib.admin */
    
    /* Make the entire sidebar dark slate */
    .main-sidebar, #nav-sidebar, .sticky-sidebar {
        background-color: var(--bg-sidebar) !important;
        border-right: 1px solid var(--border-dark) !important;
        color: var(--text-muted) !important;
    }

    #nav-sidebar .module caption, 
    .main-sidebar caption {
        background: transparent !important;
        color: #94A3B8 !important; /* Muted text */
        font-weight: 600 !important;
        text-transform: uppercase !important;
        font-size: 0.75rem !important;
        padding: 1rem 1rem 0.5rem 1rem !important;
        border: none !important;
        letter-spacing: 0.05em;
    }
    
    #nav-sidebar table {
        background: transparent !important;
    }
    
    #nav-sidebar a.section:link, #nav-sidebar a.section:visited {
        color: #E2E8F0 !important; /* Light text for links */
        padding: 0.5rem 1rem !important;
        border-bottom: none !important;
        transition: all 0.2s;
        font-weight: 400 !important;
    }
    
    #nav-sidebar a:hover {
        background-color: rgba(255,255,255,0.05) !important;
        color: white !important;
    }
    
     /* Hide the "Application" header if it looks redundant */
    #nav-sidebar .app-name {
         border-bottom: 1px solid var(--border-dark) !important;
    }
    
    /* Search box in sidebar */
    #nav-sidebar input[type=text] {
        background: rgba(0,0,0,0.2) !important;
        border: 1px solid var(--border-dark) !important;
        color: white !important;
    }

    /* --- RIGHT FILTER SIDEBAR --- */
    #changelist-filter {
        background-color: var(--bg-surface) !important;
        border-left: 1px solid var(--border-color) !important;
        box-shadow: none !important;
        padding: 0 !important;
        width: 280px !important;
    }
    
    #changelist-filter h2 {
        background: var(--bg-body) !important;
        color: var(--text-main) !important;
        font-size: 0.8rem !important;
        text-transform: uppercase;
        padding: 1rem !important;
        border-bottom: 1px solid var(--border-color);
        margin: 0 !important;
        font-weight: 600 !important;
        letter-spacing: 0.05em;
    }
    
    #changelist-filter h3 {
        color: var(--text-secondary) !important;
        font-size: 0.75rem !important;
        padding: 1rem 1rem 0.5rem 1rem !important;
        margin: 0 !important;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    
    #changelist-filter ul {
        padding: 0 1rem 1rem 1rem !important;
        border-bottom: 1px solid var(--border-color);
    }
    
    #changelist-filter li {
        margin-bottom: 0.25rem;
    }
    
    #changelist-filter a {
        color: var(--text-main) !important;
        padding: 0.25rem 0.5rem;
        display: block;
        border-radius: var(--radius-sm);
        transition: background 0.1s;
    }
    
    #changelist-filter a:hover {
        color: var(--primary) !important;
        background: var(--bg-body);
        text-decoration: none !important;
    }
    
    #changelist-filter li.selected a {
        background: var(--primary-light) !important;
        color: var(--primary) !important;
        font-weight: 500;
    }

    /* --- MAIN CONTENT AREAS --- */
    .module, .results, .paginator {
        background: var(--bg-surface) !important;
        border: 1px solid var(--border-color) !important;
        box-shadow: var(--shadow-sm);
        border-radius: var(--radius-md);
        margin-bottom: 20px !important;
    }
    
    #changelist-form .results {
        border-radius: var(--radius-md) var(--radius-md) 0 0;
        border-bottom: none !important;
        box-shadow: none;
        margin-bottom: 0 !important;
    }
    
    /* Clean Actions/Toolbar */
    .actions {
        background: var(--bg-body) !important;
        border: 1px solid var(--border-color) !important;
        border-top: none !important;
        padding: 0.75rem 1rem !important;
        color: var(--text-secondary) !important;
        border-radius: 0 0 var(--radius-md) var(--radius-md);
    }

    .actions label {
        font-size: 0.85rem !important;
    }
    
    /* --- TABLES --- */
    table {
        border-collapse: collapse !important;
    }
    
    thead th {
        background: #F8FAFC !important;
        border-bottom: 1px solid #E2E8F0 !important;
        border-top: none !important;
        color: #475569 !important; /* Slate 600 */
        font-weight: 600 !important;
        text-transform: uppercase;
        font-size: 0.7rem !important;
        padding: 0.75rem 1rem !important;
        letter-spacing: 0.03em;
    }
    
    thead th a {
        color: inherit !important;
    }
    
    tbody tr td, tbody tr th {
        border-bottom: 1px solid #F1F5F9 !important; /* Very subtle border */
        color: var(--text-main) !important;
        padding: 0.875rem 1rem !important;
        font-size: 0.875rem !important;
        vertical-align: middle !important;
    }
    
    tbody tr:nth-child(even) {
        background: white !important;
    }
    
    tbody tr:nth-child(odd) {
        background: white !important;
    }
    
    tbody tr:hover {
        background: #F8FAFC !important;
    }

    /* --- LINKS --- */
    a:link, a:visited {
        color: var(--primary);
        text-decoration: none;
    }
    
    a:hover {
        color: var(--primary-hover);
        text-decoration: underline;
    }

    /* --- BREADCRUMBS --- */
    div.breadcrumbs {
        padding: 1.5rem 0 !important;
        background: transparent !important;
        color: var(--text-secondary) !important;
        font-size: 0.85rem;
        border: none !important;
    }
    
    div.breadcrumbs a {
        color: var(--text-secondary) !important;
    }
    
    div.breadcrumbs a:hover {
        color: var(--text-main) !important;
    }

    /* --- BUTTONS --- */
    /* Primary */
    .button, input[type=submit], input[type=button], .submit-row input {
        background: var(--primary) !important;
        color: white !important;
        border: 1px solid transparent !important;
        border-radius: var(--radius-sm) !important;
        padding: 0.5rem 1rem !important;
        font-weight: 500 !important;
        cursor: pointer;
        transition: all 0.15s;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        font-size: 0.85rem !important;
        text-transform: none !important;
        height: auto !important;
    }
    
    .button:hover, input[type=submit]:hover {
        background: var(--primary-hover) !important;
    }

    /* Default / Secondary Buttons */
    .button.default, input.default {
        background: white !important;
        color: var(--text-main) !important;
        border: 1px solid var(--border-color) !important;
    }
    
    .button.default:hover, input.default:hover {
        background: var(--bg-body) !important;
        border-color: var(--border-dark) !important;
    }

    /* Add Button (Green -> Indigo or clean slate) */
    .object-tools a.addlink {
        background: var(--primary) !important;
        border-radius: var(--radius-sm) !important;
        color: white !important;
        font-weight: 500 !important;
        text-transform: none !important;
        padding-left: 2rem !important; /* Space for icon */
        position: relative;
    }
    
    .object-tools a.addlink:before {
        /* Pseudo-element for clean icon if we wanted, or default django icon */
    }
    
    .object-tools a.addlink:hover {
        background: var(--primary-hover) !important;
    }

    /* --- FORM INPUTS --- */
    input[type=text], input[type=password], input[type=email], input[type=url], input[type=number],
    textarea, select {
        border: 1px solid var(--border-color) !important;
        border-radius: var(--radius-sm) !important;
        padding: 0.5rem !important;
        background: var(--bg-surface) !important;
        color: var(--text-main) !important;
        transition: border 0.15s, box-shadow 0.15s;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    
    input:focus, select:focus, textarea:focus {
        border-color: var(--primary) !important;
        box-shadow: 0 0 0 3px var(--primary-light) !important;
        outline: none;
    }

    /* --- MESSAGES --- */
    .messagelist { margin: 0 0 1.5rem 0 !important; }
    .messagelist li {
        background: var(--bg-surface) !important;
        border-left: 4px solid var(--success);
        box-shadow: var(--shadow-sm);
        color: var(--text-main) !important;
        margin-bottom: 0.5rem;
        padding: 1rem !important;
    }
    .messagelist li.warning { border-color: var(--warning); }
    .messagelist li.error { border-color: var(--danger); }
    
</style>
<!-- Mobile/Sidebar Toggle Script placeholder if needed -->
{% endblock %}
