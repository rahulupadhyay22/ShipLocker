{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CamelTrunk - India, Delivered{% endblock %}</title>
    <meta name="description"
        content="{% block meta_description %}Get your free virtual Indian address. Shop from Amazon India, Myntra, Flipkart & 1000+ stores. We consolidate & ship to 200+ countries.{% endblock %}">

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    {% block extra_css %}{% endblock %}
</head>

<body class="home-page public-page">
    {% include 'partials/site_header.html' %}

    <!-- Main Content -->
    <main class="public-page-content">
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/site_footer.html' %}

    <script src="{% static 'js/site-header.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
